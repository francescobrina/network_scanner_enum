name: PortDrift Android APK
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (current command-line tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 17 platform and build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile APK and run JVM tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PortDrift-Mobile-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release-apk:
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'PortDrift Mobile 0.5')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PortDrift-Mobile-Android-APK
          path: apk
      - name: Publish verified APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="apk/app-debug.apk"
          test -s "$APK"
          gh release create v0.5.0-beta.1 "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PortDrift Mobile v0.5.0 beta.1 — Android native scanner" \
            --notes-file android/RELEASE_NOTES.md \
            --prerelease
