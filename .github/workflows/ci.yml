name: Tests and distribution
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m compileall -q cli.py reporting.py scanners gui tests
      - name: Unit tests (localhost and mocks only)
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install and inspect entry point
        run: |
          python -m pip install dist/*.whl
          network-scan --help
