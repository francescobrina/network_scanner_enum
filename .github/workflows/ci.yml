name: Tests and distribution
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m compileall -q cli.py reporting.py ai_assistant.py import_nmap.py scanners gui tests
      - name: Unit tests (localhost and mocks only)
        run: python -m unittest discover -s tests -v
      - name: GUI smoke test in virtual display
        run: |
          xvfb-run -a env GUI_SMOKE=1 python -m unittest tests.test_gui_smoke -v
      - name: Node.js dashboard tests
        run: node --test dashboard/tests/*.test.mjs
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install and inspect entry point
        run: |
          python -m pip install dist/*.whl
          network-scan --help
          network-scan-nmap --help

  release:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Release v0.3.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Bundle standalone browser dashboard
        run: zip -qr portdrift-dashboard.zip dashboard/
      - name: Publish GitHub release with distribution artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 dist/*.whl dist/*.tar.gz portdrift-dashboard.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.3.0 — Network Scanner with optional local AI" \
            --notes-file RELEASE_NOTES.md
